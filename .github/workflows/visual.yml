name: Visual Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/vue-web/**'
      - 'packages/uni/**'
      - 'apps/studio/**'
      - 'templates/**'

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10'

jobs:
  visual:
    name: Visual (placeholder, Phase 2+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Phase 2+ will enable Playwright visual snapshots once Button / Input / Form / Card / Template exist.
      # Per WBS-005/TEST-006 the first visual matrix is Light × Modern × Comfortable, etc.
      - name: Visual regression not yet enabled
        if: always()
        run: |
          echo "Visual regression is a placeholder during Foundation."
          echo "Will enable in Phase 2 once components and templates exist."
          exit 0