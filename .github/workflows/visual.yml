name: Visual Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/vue-web/**'
      - 'packages/uni/**'
      - 'apps/studio/**'
      - 'templates/**'

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual (placeholder, Phase 2+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No explicit `version:` on purpose: package.json already declares
      # `packageManager`, and pnpm/action-setup@v4 hard-fails with
      # "Multiple versions of pnpm specified" when both are present — which is
      # exactly why this job died ~6s in on every PR. The other four workflows
      # already rely on packageManager; this one was the outlier.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22：与 ci.yml 对齐（engines >=20 仍满足）。
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Phase 2+ will enable Playwright visual snapshots once Button / Input / Form / Card / Template exist.
      # Per WBS-005/TEST-006 the first visual matrix is Light × Modern × Comfortable, etc.
      - name: Visual regression not yet enabled
        if: always()
        run: |
          echo "Visual regression is a placeholder during Foundation."
          echo "Will enable in Phase 2 once components and templates exist."
          exit 0
