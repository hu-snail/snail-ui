name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22：uni-x 的 build 直接 \`node src/transform/cli.ts\` 运行 TS，
          # 依赖 type stripping（22.18+ 默认启用）；Node 20 会报
          # ERR_UNKNOWN_FILE_EXTENSION（AGENTS.md engines 仍为 >=20）。
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  contract:
    name: Contract (packages build cross-deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: baseline
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22：uni-x build 依赖 TS type stripping（见 baseline 同注）。
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Verify package dependency direction (protocol → schema → runtime → vue-web / uni / ai)
        run: pnpm turbo run build --filter='./packages/*' --dry-run=json
