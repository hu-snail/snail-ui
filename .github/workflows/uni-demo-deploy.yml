name: uni-demo deploy

# uni 端演示站（apps/uni-demo）的 H5 产物部署到 GitHub Pages。
# docs 组件文档的 uni 预览 iframe 指向该站点（ADR-0005）。
#
# ⚠️ 本 workflow 只在手动触发时使用，**不要**给它加 `push` 触发。
# GitHub Pages 每仓库只有一个站点，而它的产物是"仅演示站"的整站快照
# （upload path = apps/uni-demo/dist/build/h5），一旦部署就会把
# `/uni-templates/` 子目录整个抹掉——那里是场景模板站。
#
# 日常部署走 `.github/workflows/uni-sites-deploy.yml`：它一次构建两个站点、
# 合并成同一个产物（根 = 演示站，/uni-templates/ = 模板站）。它的触发路径
# 是本文件原先那组的严格超集，所以删掉 `push` 不会漏部署。
#
# 本文件保留给"只想单独重发演示站、且明确接受模板站会掉"的应急场景。

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: uni-demo-pages
  cancel-in-progress: true

env:
  # GitHub Pages 项目站：https://<owner>.github.io/<repo>/
  UNI_H5_BASE: /snail-ui/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22：与 ci.yml 对齐（engines >=20 仍满足）。
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # demo 源经 @snui/uni-src 别名引用组件库源码；App.vue 另引入
      # '@snui/uni/styles' 与风格包（@snui/style-packs → dist），需先构建
      # 组件库、风格包及其 token 依赖。
      - name: Build @snui/uni + @snui/style-packs (with deps)
        run: pnpm --filter @snui/uni... --filter @snui/style-packs... run build

      - name: Build uni-demo H5
        run: pnpm --filter @snui/uni-demo run build:h5

      - name: Disable Jekyll
        run: touch apps/uni-demo/dist/build/h5/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/uni-demo/dist/build/h5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
